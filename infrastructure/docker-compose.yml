# MonsterOS infrastructure — all open source, no paid vendors.
# Usage: docker compose -f infrastructure/docker-compose.yml --env-file .env up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monster}
      POSTGRES_DB: ${POSTGRES_DB:-monsteros}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      # Without credentials the image disables network access for 'default',
      # so host services can't query it. Mirror the Postgres monster/monster default.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-monster}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-monster}
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  redis:
    image: redis:7
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-monsteradmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-monsteradmin123}
    ports: ["9002:9000", "9001:9001"]
    volumes: [minio_data:/data]

  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    volumes: [grafana_data:/var/lib/grafana]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]

volumes:
  pg_data: {}
  ch_data: {}
  redis_data: {}
  minio_data: {}
  grafana_data: {}
  ollama_data: {}
