[package]
name = "arbitrage-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../../common" }
actix-web = "=4.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
