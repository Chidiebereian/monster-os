[package]
name = "feature-store"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../../common" }
actix-web = "=4.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
